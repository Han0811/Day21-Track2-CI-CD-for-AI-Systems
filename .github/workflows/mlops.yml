name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'params.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Huan luyen mo hinh va luu tru model/metrics vao GitHub Artifacts.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: ml_artifacts
          path: |
            models/model.pkl
            outputs/metrics.json


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.65).
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml_artifacts

      - name: Check eval gate
        run: |
          python - <<'EOF'
          import sys
          import json
          metrics = json.load(open('outputs/metrics.json'))
          acc = metrics['accuracy']
          if acc < 0.65:
              print(f"FAILED: accuracy {acc:.4f} < 0.65. Pipeline dung.")
              sys.exit(1)
          print(f"PASSED: accuracy {acc:.4f} >= 0.65. Tien hanh Smoke Test.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - SMOKE TEST (Thay the Deploy GCE)
  # Chay thu server de kiem tra tinh trang hoat dong.
  # ---------------------------------------------------------------------------
  smoke_test:
    name: Smoke Test
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml_artifacts
          path: .

      - name: Run server and health check
        run: |
          # Chay server trong background
          nohup python src/serve.py > server.log 2>&1 &
          sleep 5
          # Kiem tra health check
          curl -sf http://localhost:8000/health && echo "Health check passed!" || (cat server.log && exit 1)
          # Kill server sau khi xong
          pkill -f "python src/serve.py"
